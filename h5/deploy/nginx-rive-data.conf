location = /api/v1/analytics/events {
    client_max_body_size 64k;
    limit_req zone=rive_host_writes burst=20 nodelay;
    limit_conn rive_host_connections 20;
    limit_req_status 429;
    access_log off;
    proxy_pass http://rive_host_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /api/v1/analytics/summary {
    access_log off;
    proxy_pass http://rive_host_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

location = /api/v1/analytics/auth {
    client_max_body_size 4k;
    limit_req zone=rive_host_analytics_auth burst=5 nodelay;
    limit_conn rive_host_connections 10;
    limit_req_status 429;
    access_log off;
    proxy_pass http://rive_host_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /api/v1/analytics/logout {
    client_max_body_size 4k;
    access_log off;
    proxy_pass http://rive_host_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

location = /data {
    return 308 /data/;
}

location = /data/index.html {
    root /var/www/rive-data/current;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /data/assets/ {
    root /var/www/rive-data/current;
    try_files $uri =404;
    access_log off;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /data/ {
    root /var/www/rive-data/current;
    try_files $uri $uri/ /data/index.html;
    access_log off;
    gzip_static on;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
